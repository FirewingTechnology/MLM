# ====================================================================
# Render Blueprint Specification (render.yaml)
# Project: Binary MLM Enterprise Application (Production Persistent SQLite)
# Branch: dev
# Documentation: https://render.com/docs/blueprint-spec
# NOTE: SQLite persistence on Render requires a Persistent Disk (Starter plan or above).
# ====================================================================

services:
  # ------------------------------------------------------------------
  # 1. FastAPI Backend Web Service with Persistent SQLite Storage
  # ------------------------------------------------------------------
  - type: web
    name: mlm-backend
    runtime: python
    region: oregon
    plan: starter  # Starter plan or higher is required for persistent disk mounts
    branch: dev
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: mlm-persistent-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: ENV
        value: production
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: "*"
      # SQLite Database is stored directly on the mounted persistent disk:
      - key: SQLITE_DB_PATH
        value: /var/data/mlm.sqlite3
      - key: DATABASE_URL
        value: sqlite:////var/data/mlm.sqlite3
      - key: BACKUP_DIR
        value: /var/data/backups

  # ------------------------------------------------------------------
  # 2. React Vite Frontend Static Site
  # ------------------------------------------------------------------
  - type: web
    name: mlm-frontend
    runtime: static
    region: oregon
    plan: free
    branch: dev
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mlm-backend
          property: host

# --------------------------------------------------------------------
# 3. Optional Managed PostgreSQL Database
# Uncomment this section if you wish to provision a dedicated PostgreSQL DB on Render
