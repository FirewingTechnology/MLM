# ====================================================================
# Render Blueprint Specification (render.yaml)
# Project: Virtual Binary MLM Demo Web Application
# Documentation: https://render.com/docs/blueprint-spec
# ====================================================================

services:
  # ------------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # ------------------------------------------------------------------
  - type: web
    name: mlm-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: "*"
      # SQLite is enabled by default (demo environment auto-seeds on startup):
      - key: DATABASE_URL
        value: sqlite:///./mlm_demo.db
      # If using Render Managed PostgreSQL below, comment out the SQLite DATABASE_URL above
      # and uncomment the block below:
      # - key: DATABASE_URL
      #   fromDatabase:
      #     name: mlm-db
      #     property: connectionString

  # ------------------------------------------------------------------
  # 2. React Vite Frontend Static Site
  # ------------------------------------------------------------------
  - type: web
    name: mlm-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mlm-backend
          property: host

# --------------------------------------------------------------------
# 3. Optional Managed PostgreSQL Database
# Uncomment this section if you wish to provision a dedicated PostgreSQL DB on Render
# --------------------------------------------------------------------
# databases:
#   - name: mlm-db
#     plan: free
#     databaseName: mlm_db
#     user: mlm_user
#     region: oregon
