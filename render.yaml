# ====================================================================
# Render Blueprint Specification (render.yaml) - 100% FREE TIER
# Project: Matching MLM Enterprise Application
# Branch: main-aws
# Documentation: https://render.com/docs/blueprint-spec
# ====================================================================

services:
  # ------------------------------------------------------------------
  # 1. FastAPI Backend Web Service (100% Free Plan)
  # ------------------------------------------------------------------
  - type: web
    name: mlm-backend
    runtime: python
    region: oregon
    plan: free
    branch: main-aws
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: APP_ENV
        value: production
      - key: ALLOW_SQLITE_IN_PROD
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: "*"
      - key: SQLITE_DB_PATH
        value: ./data/mlm.sqlite3
      - key: DATABASE_URL
        value: sqlite:///./data/mlm.sqlite3
      - key: BACKUP_DIR
        value: ./data/backups

  # ------------------------------------------------------------------
  # 2. React Vite Frontend Static Site (Free by default on Render CDN)
  # ------------------------------------------------------------------
  - type: web
    name: mlm-frontend
    runtime: static
    branch: main-aws
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: mlm-backend
          property: host
