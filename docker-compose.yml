version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=virtual-Matching-mlm-secret-key-2026
      - JWT_SECRET_KEY=virtual-Matching-mlm-jwt-secret-2026
      - DATABASE_URL=sqlite:///mlm_demo.db
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./backend/data:/app/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend
